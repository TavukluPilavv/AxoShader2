# AxoShader2 - balanced realistic shader settings
# Main configuration: shaders/shaders.properties

# Shadow pass controls (Iris)
shadow.enabled = true
shadowTerrain = true
shadowEntities = true
shadowPlayer = true
shadowBlockEntities = true
shadowDistanceRenderMul = 1.0
shadowMapResolution = 2048
shadowDistance = 96.0

# Sky / sun / moon
sun = true
moon = true
sky = true
stars = true

# Clouds
clouds = true

# Notes:
# Higher shadow resolution/distance can reduce FPS, especially on mobile.
# The player shadow is mainly visible in third-person; first-person body
# rendering is limited by Minecraft/Iris behavior.
# This shaderpack is a prototype and still needs in-game Iris testing.
