# AxoShader2 - centralized shader settings
# Main settings file: shaders/shaders.properties
# FPS-conscious quality profile

# Shadows (blocks, foliage, entities/player - shader support is experimental)
shadow.enabled = true
shadowMapResolution = 1024
shadowDistance = 72.0

# Sky and atmosphere
sun = true
moon = true
sky = true
stars = true

# Clouds
clouds = true

# Quality notes:
# Sun glow, water animation, foliage sway, shadow filtering and block color
# enhancement are implemented in shader source files under shaders/.
# Iris/Minecraft compatibility and FPS must be tested in-game.
# 1024 shadow map and 72-block shadow distance are intended as a balanced preset.
# Higher shadow resolution/distance may reduce FPS.
